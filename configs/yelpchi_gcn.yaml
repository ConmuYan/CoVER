project: cover_fd
dataset:
  name: yelpchi
  path: datasets/YelpChi.mat
  format: mat
  scarcity_ratio: 1.0

model:
  name: gcn
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5

train:
  seed: 0
  epochs: 300
  debug_epochs: 3
  lr: 0.005
  weight_decay: 0.0005
  patience: 50
  device: cuda

evidence:
  trace_size: 2000
  teacher: rule
  use_verifier: true
  use_counter: true

reasoner:
  hidden_dim: 128
  evidence_emb_dim: 16
  rho: 0.3
  lambda_evi: 0.5
  use_type_loss: true
  use_evidence_loss: true
  use_residual_gate: true

eval:
  k_values: [50, 100, 200]

llm:
  backend: mock
  model_name_or_path: mock-llm
  temperature: 0.0
  max_retries: 1
  max_new_tokens: 128
  device_map: auto
  torch_dtype: auto
  trust_remote_code: true
  max_trace_nodes_debug: 8
  max_trace_nodes: 1000
