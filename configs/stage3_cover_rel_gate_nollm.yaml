project: cover_fd
dataset:
  name: yelpchi
  path: /data1/mq/codes/awesome-graph-anomaly-detection/cover-fd/datasets/YelpChi.mat
  format: mat
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true

model:
  name: bwgnn
  hidden_dim: 64
  num_layers: 2
  dropout: 0.3
  num_bands: 3
  agg: concat

train:
  seed: 123
  epochs: 100
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 100
  device: cuda:0
  select_metric: auprc

reasoner:
  hidden_dim: 128
  evidence_emb_dim: 16
  gate_mode: safe_residual
  residual_init_zero: true
  gate_bias_init: -2.0
  loss_mode: cover_lift
  use_teacher_latents: false
  use_relation_features: true
  relation_set: all
  relation_dim: 27
  relation_hidden_dim: 32
  relation_fusion_mode: anchor_gate
  anchor_relation: RUR
  optional_relations: [RSR, RTR]
  lambda_gate_sparse: 0.0001
  relation_dropout: 0.1
  log_relation_gates: true
  gate_hidden_dim: 64
  gate_temperature: 1.0
  gate_warmup_epochs: 0
  latent_dim: 256
  rho: 0.1
  delta_scale: 2.0
  max_allowed_shift: 0.2
  lambda_cve: 0.3
  lambda_latent: 0.0
  lambda_intervene: 0.05
  lambda_pairrank: 0.3
  pairrank_temperature: 0.1
  threshold_mode: val_macro_f1

eval:
  k_values: [50, 100, 200]
