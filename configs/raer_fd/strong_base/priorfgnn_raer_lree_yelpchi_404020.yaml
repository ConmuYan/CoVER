dataset:
  name: yelpchi
train:
  seed: 42
project: raer_fd
raer_teacher:
  run_name: strong_base_priorfgnn_raer_lree_404020
  epochs: 300
  patience: 300
  lr: 0.001
  weight_decay: 0.0001
  early_stop_metric: val_auprc
  relation_names:
  - RUR
  - RTR
  - RSR
  anchor_relation: RUR
  rel_hidden_dim: 64
  rel_num_layers: 2
  rel_dropout: 0.3
  tau_gate: 0.7
  delta_rel_max: 2.0
  gate_mode: softmax
  evidence:
    source: learned
    extractor:
      hidden_dim: 32
      encoder_out_dim: 16
      out_dim_per_rel: 9
      dropout: 0.3
      use_gcn_emb: true
      use_proto_features: true
      encoder_shared: false
experiment:
  family: strong_base_saturation
  stage: teacher
  run_name: strong_base_priorfgnn_raer_lree_404020
  base: priorfgnn
  split: '40_20_40'
