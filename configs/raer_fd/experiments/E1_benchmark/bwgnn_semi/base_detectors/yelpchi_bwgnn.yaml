project: raer_fd
dataset:
  name: yelpchi
  path: datasets/YelpChi.mat
  format: mat
  split_mode: semi-supervised
  train_ratio: 0.01
  val_test_ratio:
  - 1
  - 2
  scarcity_ratio: 1.0
  stratified: true
model:
  name: bwgnn
  hidden_dim: 64
  num_layers: 2
  dropout: 0.3
  num_bands: 3
  agg: concat
train:
  seed: 0
  epochs: 100
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 100
  device: cuda:0
  select_metric: macro_f1
eval:
  k_values:
  - 50
  - 100
  - 200
experiment:
  family: base_detector
  stage: base
  run_name: yelpchi_bwgnn_base_bwgnn_semi
