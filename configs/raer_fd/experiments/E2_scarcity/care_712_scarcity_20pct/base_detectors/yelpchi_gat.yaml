project: raer_fd
dataset:
  name: yelpchi
  path: datasets/YelpChi.mat
  format: mat
  split_mode: supervised
  train_ratio: 0.7
  val_test_ratio:
  - 1
  - 2
  scarcity_ratio: 0.2
  stratified: true
model:
  name: gat
  hidden_dim: 64
  num_layers: 2
  attention_heads: 1
  dropout: 0.5
train:
  seed: 0
  epochs: 100
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 100
  device: cuda:0
  select_metric: macro_f1
eval:
  k_values:
  - 50
  - 100
  - 200
experiment:
  family: base_detector
  stage: base
  run_name: yelpchi_gat_base_care_712_scarcity_20pct
