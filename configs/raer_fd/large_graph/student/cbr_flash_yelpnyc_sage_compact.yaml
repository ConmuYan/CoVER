project: raer_fd
dataset:
  name: yelpnyc
  path: datasets/YelpNYC.mat
  format: mat
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true
model:
  name: sage
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
train:
  seed: 0
  epochs: 60
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 15
  device: cuda:0
  select_metric: auprc
eval:
  k_values: [50, 100, 200]
raer_teacher:
  run_name: raer_hc_compact
  relation_names: [RUR, RSR, RTR]
  anchor_relation: RUR
  rel_hidden_dim: 64
  rel_num_layers: 2
  rel_dropout: 0.3
  tau_gate: 0.7
  delta_rel_max: 2.0
  gate_mode: softmax
  evidence_groups: [A, B, C]
  residual_activation: tanh
  evidence:
    source: hand_crafted
experiment:
  family: cbr_flash_large_graph
  stage: student
  run_name: cbr_flash_compact
  teacher_family: raer_hc_compact
cbr_flash:
  run_name: cbr_flash_compact
  mask_criterion: topk_student_entropy
  cbr_weight_form: linear
  cbr_lambda: 0.5
  K: 4096
  lambda_min: 0.05
  lambda_extra: 0.5
  lr: 0.001
  weight_decay: 0.0001
  epochs: 60
  patience: 8
  eval_interval: 5
