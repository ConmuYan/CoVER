project: raer_fd
dataset:
  name: tsocial
  path: datasets/tsocial
  format: dgl
  hsd_invert: false
  append_hsd: false
  hsd_chunk_size: 250000
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true
model:
  name: sage
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
train:
  seed: 0
  epochs: 50
  debug_epochs: 3
  lr: 0.003
  optimizer: adam
  weight_decay: 0.001
  patience: 10
  device: cuda:0
  select_metric: auprc
eval:
  k_values: [50, 100, 200]
raer_teacher:
  run_name: raer_lree_scalable
  relation_names: [EDGE]
  anchor_relation: EDGE
  rel_stat_dim: 9
  rel_hidden_dim: 64
  rel_num_layers: 2
  rel_dropout: 0.3
  tau_gate: 0.7
  delta_rel_max: 2.0
  gate_mode: softmax
  evidence_groups: [A, B, C]
  residual_activation: tanh
  feature_batch_size: 262144
  evidence:
    source: scalable_lree
    extractor:
      hidden_dim: 32
      dropout: 0.3
      out_dim_per_rel: 9
      shared_encoder: false
experiment:
  family: cbr_flash_lree_scalable_large_graph
  stage: student
  run_name: cbr_flash_lree_scalable
  teacher_family: raer_lree_scalable
cbr_flash:
  run_name: cbr_flash_lree_scalable
  mask_criterion: topk_student_entropy
  cbr_weight_form: linear
  cbr_lambda: 0.5
  K: 8192
  lambda_min: 0.05
  lambda_extra: 0.5
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  patience: 8
  eval_interval: 5
  teacher_cache_batch_size: 262144
  full_batch_size: 262144
  eval_batch_size: 262144
