project: raer_fd
dataset:
  name: tsocial
  path: datasets/tsocial
  format: dgl
  hsd_invert: false
  append_hsd: false
  hsd_chunk_size: 250000
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true
model:
  name: sage
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
train:
  seed: 0
  epochs: 50
  debug_epochs: 3
  lr: 0.003
  optimizer: adam
  weight_decay: 0.001
  patience: 10
  device: cuda:0
  select_metric: auprc
minibatch:
  run_name: base_neighbor_mb
  sampling_direction: in
  undirected_sampling: false
  add_reverse_edges: false
  num_neighbors: [15, 10, 5]
  eval_num_neighbors: [15, 10, 5]
  batch_size: 512
  eval_batch_size: 512
  cache_batch_size: 1024
  cache_dtype: float16
  grad_clip: 1.0
  log_every: 5
eval:
  k_values: [50, 100, 200]
experiment:
  family: base_detector_large_graph
  stage: base
  run_name: tsocial_sage_base_neighbor_mb
