project: raer_fd
dataset:
  name: tsocial
  path: datasets/tsocial
  format: dgl
  hsd_invert: false
  append_hsd: false
  hsd_chunk_size: 250000
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true
model:
  name: sage
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5
train:
  seed: 0
  epochs: 50
  debug_epochs: 3
  lr: 0.003
  optimizer: adam
  weight_decay: 0.001
  patience: 10
  device: cuda:0
  select_metric: auprc
eval:
  k_values: [50, 100, 200]
raer_teacher:
  run_name: raer_hc_compact
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  epochs: 80
  patience: 15
  early_stop_metric: val_auprc
  relation_names: [EDGE]
  anchor_relation: EDGE
  rel_hidden_dim: 64
  rel_num_layers: 2
  rel_dropout: 0.3
  tau_gate: 0.7
  evidence_tau: 1.5
  delta_rel_max: 2.0
  gate_mode: softmax
  evidence_groups: [A, B, C]
  expert_shared: false
  residual_activation: tanh
  eval_interval: 1
  evidence:
    source: hand_crafted
experiment:
  family: raer_hc_large_graph
  stage: teacher
  run_name: raer_hc_compact
  canonical_name: RAER-HC-Compact
