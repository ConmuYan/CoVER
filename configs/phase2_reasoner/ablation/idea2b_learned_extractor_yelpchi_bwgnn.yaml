project: cover_fd

# Idea-2B smoke test: learned evidence extractor (drop-in 9-dim replacement)
# on YelpChi-BWGNN. Identical to idea1_canonical_clsonly.yaml except for the
# phase2_reasoner.evidence section, which switches the evidence source from
# the hand-crafted A/B/C 9-dim vector (loaded from disk) to an online,
# end-to-end-trained LearnedRelationEvidenceExtractor.
#
# Contract preservation:
#   - Score-blind: extractor inputs are x + per-rel adj + train_mask + train_labels.
#     NEVER sees base_logit or base_z.
#   - Train-only prototype: class-anchored proto features computed under
#     torch.no_grad() over train_mask & (train_labels == c) only.
#   - Frozen base + bounded intervention: unchanged from canonical.
#
# Reference comparison config: ablation/idea1_canonical_clsonly.yaml
# Paired-t bar: ≥ 5 seeds, |t| > 2.78 for p<0.05.

dataset:
  name: yelpchi
  path: /data1/mq/codes/awesome-graph-anomaly-detection/cover-fd/datasets/YelpChi.mat
  format: mat
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true

model:
  name: bwgnn
  hidden_dim: 64
  num_layers: 2
  dropout: 0.3
  num_bands: 3
  agg: concat

train:
  seed: 0
  epochs: 100
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 100
  device: cuda:0
  select_metric: auprc

phase2_reasoner:
  run_name: idea2b_learned_extractor
  two_stage: true
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  epochs: 300
  patience: 50
  early_stop_metric: val_auprc
  relation_names: [RUR, RSR, RTR]
  anchor_relation: RUR
  rel_hidden_dim: 64
  rel_num_layers: 2
  rel_dropout: 0.30
  tau_gate: 0.7
  evidence_tau: 1.5
  delta_rel_max: 2.0

  gate_mode: softmax
  evidence_groups: [A, B, C]

  # === Idea 2B switch ===
  evidence:
    source: learned
    extractor:
      hidden_dim: 32
      encoder_out_dim: 16
      out_dim_per_rel: 9   # drop-in match for canonical 9-dim
      dropout: 0.3

  use_judge: false
  alpha_max: 0.0

  lambda_int: 0.0
  lambda_sparse: 0.0
  lambda_align: 0.0

  eval_interval: 1

eval:
  k_values: [50, 100, 200]
