project: cover_fd

# Idea-1 ablation #5: REMOVE prototype-relative evidence sub-group (C).
# Sets evidence_groups=[A, B] → zero-masks the 3 prototype-distance dims
# (fraud_proto_dist_z, benign_proto_dist_z, fraud_minus_benign_margin_z)
# in each per-relation 9-dim chunk before feeding to Expert_r.
# Pairs with: ablation/idea1_canonical_clsonly.yaml
# Tests reviewer Q: "Is the train-only relation prototype prior the main
#                   driver of the rel-branch lift, or do structural (A) +
#                   feature-neighbor (B) signals suffice?"
# Expected if prototype matters: largest negative ΔAUPRC among A/B/C drops
# (5-seed paired t < 0, |t| > 2.78).

dataset:
  name: yelpchi
  path: /data1/mq/codes/awesome-graph-anomaly-detection/cover-fd/datasets/YelpChi.mat
  format: mat
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true

model:
  name: bwgnn
  hidden_dim: 64
  num_layers: 2
  dropout: 0.3
  num_bands: 3
  agg: concat

train:
  seed: 0
  epochs: 100
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 100
  device: cuda:0
  select_metric: auprc

phase2_reasoner:
  run_name: idea1_ablate_evidence_no_proto
  two_stage: true
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  epochs: 300
  patience: 50
  early_stop_metric: val_auprc
  relation_names: [RUR, RSR, RTR]
  anchor_relation: RUR
  rel_hidden_dim: 64
  rel_num_layers: 2
  rel_dropout: 0.30
  tau_gate: 0.7
  evidence_tau: 1.5
  delta_rel_max: 2.0

  gate_mode: softmax
  # ABLATION: zero-mask the 3 prototype-relative dims (indices 6,7,8 per relation)
  evidence_groups: [A, B]

  use_judge: false
  alpha_max: 0.0
  lambda_int: 0.0
  lambda_sparse: 0.0
  lambda_align: 0.0

  eval_interval: 1

eval:
  k_values: [50, 100, 200]
