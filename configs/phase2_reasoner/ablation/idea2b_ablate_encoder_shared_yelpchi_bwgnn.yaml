dataset:
  format: mat
  name: yelpchi
  path: /data1/mq/codes/awesome-graph-anomaly-detection/cover-fd/datasets/YelpChi.mat
  scarcity_ratio: 1.0
  split_mode: supervised
  stratified: true
  train_ratio: 0.4
  val_test_ratio:
  - 1
  - 2
eval:
  k_values:
  - 50
  - 100
  - 200
model:
  agg: concat
  dropout: 0.3
  hidden_dim: 64
  name: bwgnn
  num_bands: 3
  num_layers: 2
phase2_reasoner:
  alpha_max: 0.0
  anchor_relation: RUR
  delta_rel_max: 2.0
  early_stop_metric: val_auprc
  epochs: 300
  eval_interval: 1
  evidence:
    extractor:
      dropout: 0.3
      encoder_out_dim: 16
      hidden_dim: 32
      out_dim_per_rel: 9
      use_gcn_emb: true
      use_proto_features: true
      encoder_shared: true
    source: learned
  evidence_groups:
  - A
  - B
  - C
  evidence_tau: 1.5
  gate_mode: softmax
  lambda_align: 0.0
  lambda_int: 0.0
  lambda_sparse: 0.0
  lr: 0.001
  optimizer: adamw
  patience: 50
  rel_dropout: 0.3
  rel_hidden_dim: 64
  rel_num_layers: 2
  relation_names:
  - RUR
  - RSR
  - RTR
  run_name: idea2b_ablate_encoder_shared
  tau_gate: 0.7
  two_stage: true
  use_judge: false
  weight_decay: 0.0001
project: cover_fd
train:
  debug_epochs: 3
  device: cuda:0
  epochs: 100
  lr: 0.01
  optimizer: adam
  patience: 100
  seed: 0
  select_metric: auprc
  weight_decay: 0.0005
