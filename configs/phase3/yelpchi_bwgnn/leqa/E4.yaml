# E4 — FULL PROPOSAL: LoRA (joint) with full audit loss
# Per EXPERIMENT_PLAN.md section 2.2, Plan B
# This is the main method cell.
project: cover_fd

dataset:
  name: yelpchi
  path: /data1/mq/codes/awesome-graph-anomaly-detection/cover-fd/datasets/YelpChi.mat
  format: mat
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true

model:
  name: bwgnn
  hidden_dim: 64
  num_layers: 2
  dropout: 0.3
  num_bands: 3
  agg: concat

train:
  seed: 0
  epochs: 100
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 100
  device: cuda:0
  select_metric: auprc

phase3_leqa:
  cell: E4
  run_name: phase3_yelpchi_bwgnn_leqa_E4
  two_stage: true
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  epochs: 300
  patience: 9999
  early_stop_metric: val_auprc
  relation_names: [RUR, RSR, RTR]
  anchor_relation: RUR
  rel_hidden_dim: 64
  rel_num_layers: 2
  rel_dropout: 0.30
  tau_gate: 0.7
  evidence_tau: 1.5
  delta_rel_max: 2.0
  lambda_int: 3.0e-3
  lambda_sparse: 1.0e-3
  # LEQA-specific
  use_leqa: true
  leqa_mode: lora_joint
  lambda_audit: 3.0e-2
  delta_rel_clip: 2.0
  lora_leqa_cache_path: null
  use_random_lora_signal: false
  lora_frozen_after_epoch_1: false
  eval_interval: 1

eval:
  k_values: [50, 100, 200]
