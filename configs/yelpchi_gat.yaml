project: cover_fd
dataset:
  name: yelpchi
  path: /data1/mq/codes/awesome-graph-anomaly-detection/cover-fd/datasets/YelpChi.mat
  format: mat
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true

model:
  name: gat
  hidden_dim: 64
  num_layers: 2
  attention_heads: 1
  dropout: 0.5

train:
  seed: 0
  epochs: 100
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 100
  device: cuda:3
  select_metric: macro_f1

gpu:
  train_visible_devices: "3"
  llm_visible_devices: "3"
  qwen_parallel_visible_devices: "2,3"
  default_train_device: cuda:0
  default_llm_device: cuda:0

run:
  teacher: rule
  run_name: rule
  seed: 0

stage2:
  trace_sampler: error_aware
  trace_size: 200
  trace_size_debug: 32

evidence:
  trace_size: 1000
  trace_size_small: 32
  teacher: rule
  use_verifier: true
  use_counter: true

llm:
  backend: transformers_local
  model_name_or_path: /data1/mq/models/Qwen3-4B-Instruct-2507
  temperature: 0.0
  max_retries: 3
  max_new_tokens: 320
  device_map: auto
  torch_dtype: auto
  trust_remote_code: true
  max_trace_nodes_debug: 8
  max_trace_nodes_small: 32
  enable_verifier_retry: true
  max_verifier_retries: 1
  max_parse_retries: 1
  visible_devices: "3"

eval:
  k_values: [50, 100, 200]
