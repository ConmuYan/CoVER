project: cover_fd

# Phase 1 base detector config — trains BWGNN on YelpChi, then freezes it
# for the cls-only Phase 2 CoVER-REL Reasoner. See AGENTS.md §§1-2.
#
# Note: This file historically carried separate `gpu:`, `run:`, `stage2:`,
# `evidence:`, `llm:`, and `reasoner:` blocks for the Stage-2 LLM-judge and
# legacy directional-reasoner pipelines. All six blocks were removed in the
# cls-only cleanup — every route they configured is 5-seed paired-t falsified
# (see AGENTS.md §9 and artifacts/tables/paper_negative_routes.md).

dataset:
  name: yelpchi
  path: /data1/mq/codes/awesome-graph-anomaly-detection/cover-fd/datasets/YelpChi.mat
  format: mat
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true

model:
  name: bwgnn
  hidden_dim: 64
  num_layers: 2
  dropout: 0.3
  num_bands: 3
  agg: concat

train:
  seed: 0
  epochs: 100
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 100
  device: cuda:0
  select_metric: macro_f1

eval:
  k_values: [50, 100, 200]
