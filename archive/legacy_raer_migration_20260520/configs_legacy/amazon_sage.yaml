project: cover_fd

# Phase 1 base detector config — trains GraphSAGE on Amazon. See AGENTS.md §§1-2.

dataset:
  name: amazon
  path: /data1/mq/codes/awesome-graph-anomaly-detection/cover-fd/datasets/Amazon.mat
  format: mat
  split_mode: supervised
  train_ratio: 0.4
  val_test_ratio: [1, 2]
  scarcity_ratio: 1.0
  stratified: true

model:
  name: sage
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5

train:
  seed: 0
  epochs: 100
  debug_epochs: 3
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0005
  patience: 100
  device: cuda:0
  select_metric: macro_f1

eval:
  k_values: [50, 100, 200]
