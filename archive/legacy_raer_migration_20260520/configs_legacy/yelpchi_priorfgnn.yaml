# PriorF-GNN (LG-HGCL v2) integration into cover-fd
# Faithful port of PriorF-GNN/configs/main/yelpchi_full.yaml
# Reference seed_42 result: AUPRC=0.8475, AUROC=0.9555, F1-Macro=0.8636

project: cover_fd

dataset:
  name: yelpchi
  # Data is loaded from PriorF-GNN's pre-computed unified file to
  # guarantee identical splits/HSD with the reference run.
  unified_data_path: /data1/mq/codes/awesome-graph-anomaly-detection/PriorF-GNN/processed_data/yelpchi/seed_42/data.pt
  # Fallback raw .mat path (used if the unified file is missing; will
  # require re-computing HSD + stratified 70/10/20 split internally).
  mat_path: /data1/mq/codes/awesome-graph-anomaly-detection/cover-fd/datasets/YelpChi.mat
  split_mode: stratified
  train_ratio: 0.7
  val_test_ratio: [1, 2]
  stratified: true

model:
  name: priorfgnn
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  num_relations: 3
  use_asda: true
  use_mlp_branch: true
  use_gnn_branch: true
  asda_tau: 0.1
  proj_dim: 64
  focal_alpha: 0.25
  focal_gamma: 2.0
  lambda_sdcl: 0.1
  sdcl_tau: 0.1
  sdcl_anchors: 128
  sdcl_quantile: 0.3
  sdcl_rounds: 5
  sdcl_schedule: cosine

train:
  seed: 42
  epochs: 500
  lr: 0.003
  optimizer: adamw
  weight_decay: 0.001
  grad_clip: 1.0
  scheduler_T0: 20
  scheduler_Tmult: 2
  patience: 200
  device: cuda:0
  select_metric: auprc
  use_amp: true

eval:
  k_values: [50, 100, 200]
