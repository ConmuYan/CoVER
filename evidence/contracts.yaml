structural_discrepancy:
  required_any:
    - field: degree_level
      values: [high]
    - field: neighbor_consistency
      values: [low]
    - field: detector_signal
      values: [embedding_neighbor_discrepancy_high]
  forbidden: []

camouflage_neighbor:
  required_any:
    - field: neighbor_consistency
      values: [low]
  forbidden:
    - field: neighbor_consistency
      values: [high]

feature_structure_conflict:
  required_any:
    - field: feature_neighbor_discrepancy
      values: [high]
  forbidden:
    - field: feature_neighbor_discrepancy
      values: [low]

spectral_anomaly:
  required_any:
    - field: detector_signal
      values:
        - high_frequency_response_high
        - spectral_energy_shift_high
        - bandpass_response_high
        - embedding_neighbor_discrepancy_high
  forbidden:
    - field: detector_signal_strength
      values: [weak]

relation_or_burst_anomaly:
  required_any:
    - field: degree_level
      values: [high]
  forbidden: []

weak_or_uncertain_evidence:
  required_any: []
  forbidden: []
